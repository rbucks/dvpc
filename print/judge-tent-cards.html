<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The 4CD Pitch Competition — 2026 judges' name tents</title>
<!--
  One US Letter landscape page per judge, folded in half along the long
  centre line to stand as an 11 x 4.25in tent. The top half is printed upside
  down so the name reads upright on both sides. Edit the JUDGES list at the
  bottom to change names. Print single-sided at actual size, on card stock.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Narrow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @page { size: 11in 8.5in; margin: 0; }
  :root {
    --green: #01775b; --sage: #b5dbaf; --sage-soft: #d6ecd2;
    --navy: #1a3a6c; --navy-deep: #122a4e; --periwinkle-soft: #c5cce8;
    --paper: #fbfaf5; --ink-3: #6b7787;
    --display: "Anton", Impact, sans-serif;
    --narrow: "Archivo Narrow", "Archivo", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; }
  body { font-family: var(--narrow); -webkit-font-smoothing: antialiased; }

  .sheet {
    width: 11in; height: 8.5in; overflow: hidden; position: relative;
    print-color-adjust: exact; -webkit-print-color-adjust: exact;
    page-break-after: always; break-after: page;
  }
  .sheet:last-child { page-break-after: auto; break-after: auto; }
  /* fold marks at both edges of the centre line */
  .sheet::before, .sheet::after { content: ""; position: absolute; top: 4.25in; width: 0.3in; border-top: 0.5pt dashed var(--ink-3); }
  .sheet::before { left: 0; } .sheet::after { right: 0; }

  .face { height: 4.25in; background: var(--paper); display: flex; flex-direction: column; }
  .face.flip { transform: rotate(180deg); }

  .head { display: flex; align-items: center; gap: 0.12in; padding: 0.3in 0.6in 0; }
  .head img { width: 0.44in; height: 0.44in; display: block; }
  .head .wm { font-weight: 700; font-size: 10.5pt; letter-spacing: 0.14em; text-transform: uppercase; color: var(--navy); }
  .head .role { margin-left: auto; font-weight: 700; font-size: 11pt; letter-spacing: 0.2em; text-transform: uppercase; color: var(--green); border: 1.5pt solid var(--green); padding: 0.05in 0.14in; }

  .name { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 0.6in; font-family: var(--display); text-transform: uppercase; font-size: 104pt; line-height: 1; color: var(--navy); white-space: nowrap; letter-spacing: 0.005em; }

  .base { background: var(--green); color: var(--sage-soft); padding: 0.13in 0.6in 0.36in; display: flex; justify-content: space-between; font-weight: 700; font-size: 8.5pt; letter-spacing: 0.14em; text-transform: uppercase; }
  .base b { color: #fff; }
</style>
</head>
<body>

<template id="tent">
  <div class="sheet">
    <div class="face flip">
      <div class="head"><img src="../assets/dvc-logo-simple-green.svg" alt=""><span class="wm">The 4CD Pitch Competition</span><span class="role">Judge</span></div>
      <div class="name" data-name></div>
      <div class="base"><span><b>The live final</b> · Nov 20, 2026</span><span>Diablo Valley College</span></div>
    </div>
    <div class="face">
      <div class="head"><img src="../assets/dvc-logo-simple-green.svg" alt=""><span class="wm">The 4CD Pitch Competition</span><span class="role">Judge</span></div>
      <div class="name" data-name></div>
      <div class="base"><span><b>The live final</b> · Nov 20, 2026</span><span>Diablo Valley College</span></div>
    </div>
  </div>
</template>

<script>
  const JUDGES = ["Dan Siegel", "Luther Daniel", "Ruide Zhu", "Vasudha Paul"];
  const tpl = document.getElementById("tent");
  for (const name of JUDGES) {
    const page = tpl.content.cloneNode(true);
    page.querySelectorAll("[data-name]").forEach(n => { const s = document.createElement("span"); s.textContent = name; n.appendChild(s); });
    document.body.appendChild(page);
  }
  // Shrink any name that is wider than the card so long names never clip.
  document.fonts.ready.then(() => {
    for (const el of document.querySelectorAll(".name")) {
      const span = el.firstElementChild;
      let size = 104;
      while (span.offsetWidth > el.clientWidth - 2 * 0.6 * 96 && size > 40) el.style.fontSize = (--size) + "pt";
    }
  });
</script>
</body>
</html>
